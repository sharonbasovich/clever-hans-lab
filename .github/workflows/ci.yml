name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Harness smoke (1 seed, small n — gates enforced)
        run: npm run harness:smoke
      - name: Full measured harness (18 seeds x 3 rhos + null + determinism)
        run: RESULTS_OUT=results.ci.json npm run harness
      - name: Build
        run: npm run build
      - name: Verify results schema, gates and bundle target
        run: npx tsx scripts/verify-results.ts
      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium
      - name: E2E golden path + lifecycle/mobile
        run: npx playwright test
